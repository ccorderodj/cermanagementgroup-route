# App Spec de `cerroute-dev`: copia conciliada con la REAL de DigitalOcean
# (RTE-MAIL-CLOSE-01, CP3, 20-10-2026).
#
# Es la App Spec que hay hoy en DigitalOcean (Settings > App Spec), con los
# secretos sustituidos por un marcador. Para aplicarla NO se pega este archivo:
# se edita la spec real y se dejan los EV[1:...] actuales sin tocar.
#
# Configuración de envío elegida: la MÍNIMA SUFICIENTE.
#   * El programador interno de la app (cada minuto, réplica líder) da la
#     precisión: 12:00, End Work + 20 min y 19:00 locales de cada destinatario.
#   * UN Scheduled Job, `route-mail-reconcile`, cada 15 min en UTC, recupera lo
#     que venció y no salió (app caída o reiniciándose).
#   La propuesta anterior de tres jobs (mediodía, cierre y reconciliador) se
#   descarta: los tres ejecutaban la misma pasada completa y sobre la misma
#   clave única, así que no añadían precisión ni cobertura, solo invocaciones.
#   Un job por hora fija tampoco serviría: cada destinatario tiene su zona.
#
# El job `migrate` (PRE_DEPLOY) aplica las migraciones y `converge` (crea las
# capacidades nuevas del catálogo). Las de esta entrega: 0026 (zona operativa
# de la compañía) y 0027 (latido de los relojes y zona del envío).
#
# Interruptores del correo (ver docs/MAIL_DISPATCH_RUNBOOK.md):
#   MAIL_AUTOMATION_ENABLED=false  -> el envío automático no hace nada
#   MAIL_AUTOMATION_DRY_RUN=true   -> encendido, solo cuenta (no envía)
#   MAIL_REAL_SEND_TYPES           -> tipos con envío real (automático y manual)
# Encenderlo va por fases y con GO del PO (runbook, sección 5).

alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
domains:
- domain: cerroute.cermanagementgroup.com
  type: PRIMARY
envs:
- key: BASE_DOMAIN
  scope: RUN_AND_BUILD_TIME
  value: cermanagementgroup.com
- key: MODE
  scope: RUN_AND_BUILD_TIME
  value: DEV
- key: LOG_LEVEL
  scope: RUN_AND_BUILD_TIME
  value: INFO
- key: BOOTSTRAP_COMPANY_SUBDOMAIN
  scope: RUN_AND_BUILD_TIME
  value: cerroute
- key: DB_HOST
  scope: RUN_AND_BUILD_TIME
  value: db-dev-cer-route-do-user-17976110-0.a.db.ondigitalocean.com
- key: DB_PORT
  scope: RUN_AND_BUILD_TIME
  value: "25060"
- key: DB_USER
  scope: RUN_AND_BUILD_TIME
  value: doadmin
- key: DB_PASS
  scope: RUN_TIME
  type: SECRET
  value: <<< EV[1:...] actual, sin tocar >>>
- key: DB_NAME
  scope: RUN_AND_BUILD_TIME
  value: db-dev-cer-route
- key: SECRET_KEY
  scope: RUN_TIME
  type: SECRET
  value: <<< EV[1:...] actual, sin tocar >>>
- key: ALGORITHM
  scope: RUN_AND_BUILD_TIME
  value: HS256
- key: PLATFORM_MASTER_KEY
  scope: RUN_TIME
  type: SECRET
  value: <<< EV[1:...] actual, sin tocar >>>
- key: DB_SSL
  scope: RUN_AND_BUILD_TIME
  value: require
- key: TESSDATA_PREFIX
  scope: RUN_AND_BUILD_TIME
  value: /layers/digitalocean_apt/apt/usr/share/tesseract-ocr/4.00/tessdata
- key: ODOMETER_OCR_ENABLED
  scope: RUN_AND_BUILD_TIME
  value: "false"
- key: MAIL_AUTOMATION_ENABLED
  scope: RUN_TIME
  value: "false"
- key: MAIL_AUTOMATION_DRY_RUN
  scope: RUN_TIME
  value: "true"
- key: MAIL_REAL_SEND_TYPES
  scope: RUN_TIME
  value: midday_motivation,end_of_day_recognition,strategic_midday_report,strategic_end_of_day_report
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: cerroute
    match:
      authority:
        exact: ""
      path:
        prefix: /
jobs:
- environment_slug: python
  gitlab:
    branch: dev
    deploy_on_push: true
    repo: cermanagementgroup/cermanagementgroup-route
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  kind: PRE_DEPLOY
  name: migrate
  run_command: |
    set -e

    echo "========================================="
    echo " CER ROUTE DATABASE MIGRATION"
    echo "========================================="

    echo ""
    echo "=== PYTHON ==="
    python --version

    echo ""
    echo "=== ALEMBIC ==="
    python -m alembic --version

    echo ""
    echo "=== ENVIRONMENT ==="
    python -c "import os; print('MODE:', os.environ.get('MODE')); print('DB_HOST:', os.environ.get('DB_HOST')); print('DB_NAME:', os.environ.get('DB_NAME')); print('DB_SSL:', os.environ.get('DB_SSL')); print('DB_PASS defined:', bool(os.environ.get('DB_PASS')))"

    echo ""
    echo "=== DATABASE MODULE ==="
    python -c "import app.database as d; print('DATABASE MODULE OK')"

    echo ""
    echo "=== ALEMBIC CURRENT ==="
    python -m alembic -c app/alembic.ini current

    echo ""
    echo "=== ALEMBIC UPGRADE ==="
    python -m alembic -c app/alembic.ini upgrade head

    echo ""
    echo "=== ALEMBIC CURRENT AFTER UPGRADE ==="
    python -m alembic -c app/alembic.ini current

    echo ""
    echo "========================================="
    echo " CONFIGURATION CONVERGE"
    echo "========================================="
    echo "Capacidades nuevas y sus concesiones, valores estandar por compania."
    echo "Solo anade. Idempotente. No crea companias ni usuarios."
    python -m app.db.scripts.converge

    echo ""
    echo "========================================="
    echo " DATABASE MIGRATION COMPLETE"
    echo "========================================="
  source_dir: /
- environment_slug: python
  gitlab:
    branch: dev
    deploy_on_push: true
    repo: cermanagementgroup/cermanagementgroup-route
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  kind: SCHEDULED
  name: route-mail-reconcile
  run_command: python -m app.routers_api.activityemails.jobs --once
  schedule:
    cron: '*/15 * * * *'
    time_zone: Etc/UTC
  source_dir: /
name: cerroute-dev
region: nyc
services:
- build_command: |
    node --version
    npm --version
    cd app
    npm ci
    npm run build:prod
  environment_slug: python
  gitlab:
    branch: dev
    deploy_on_push: true
    repo: cermanagementgroup/cermanagementgroup-route
  http_port: 8000
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  name: cerroute
  run_command: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
  source_dir: /
