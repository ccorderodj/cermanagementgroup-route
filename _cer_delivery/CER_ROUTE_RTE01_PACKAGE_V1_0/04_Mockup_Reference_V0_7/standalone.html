function completionFields(){const p=state.purpose;if(p==='recruiting')return `<div class="step-form">${selectField('Outcome','outcome',demo.catalogs.outcomes)}<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="step-field"><label>People contacted</label><input class="step-input" type="number" value="8"></div><div class="step-field"><label>Potential candidates</label><input class="step-input" type="number" value="3"></div></div><div class="step-field"><label>Note · optional</label><textarea class="step-text" placeholder="Add note after arrival"></textarea></div></div>`;if(p==='check')return `<div class="step-form">${selectField('Result','outcome',demo.catalogs.outcomes)}${selectField('Received by','received',demo.catalogs.receivedBy)}<div class="step-field"><label>Note · optional</label><textarea class="step-text" placeholder="Add note after arrival"></textarea></div></div>`;return `<div class="step-form">${selectField('Outcome','outcome',demo.catalogs.outcomes)}<div class="step-field"><label>Note · optional</label><textarea class="step-text" placeholder="Add note after arrival"></textarea></div></div>`}
function currentRef(){return state.form.ref||({client:'Destination not entered',recruiting:demo.catalogs.recruitingAreas[0],employee:demo.catalogs.employeeRefs[0],check:demo.catalogs.employeeRefs[0],office:demo.catalogs.offices[0],other:demo.catalogs.recruitingAreas[0]}[state.purpose]||'')}
function supervisorRoute(){switch(state.supState){case'idle':return `<div class="screen center"><div class="screen-title">Ready for today?</div><div class="screen-sub">2024 Toyota RAV4 · V-014</div><div class="today-mile"><b>0.0 mi</b><span>today</span></div><div class="action-stack"><button class="primary-action" data-action="start-work">Start Work</button></div></div>`;case'working':return `<div class="screen"><div class="screen-title">What's next?</div><div class="screen-sub">Choose one activity to start a trip.</div>${purposeGrid()}</div>`;case'pretrip':return `<div class="screen"><div class="screen-title">${purposeName(state.purpose)}</div><div class="screen-sub">${state.purpose==='client'?'Enter the destination before departing.':'Select the trip details.'}</div><div class="step-form">${preTripForm()}</div><div class="action-stack"><button class="primary-action" data-action="start-trip">Start Trip</button><button class="secondary-action" data-action="back-purpose">Back</button></div></div>`;case'route':return `<div class="screen"><div class="trip-state"><div class="label">On Route</div><div class="main">${purposeName(state.purpose)}</div><div class="ref">${currentRef()}</div></div><div class="trip-meta"><div><b>${state.workMiles.toFixed(1)} mi</b><span>miles today</span></div><div><b>8:04 AM</b><span>departed</span></div></div><div class="action-stack"><button class="primary-action" data-action="arrive">Arrived</button><button class="secondary-action" data-action="change-plan">Change Plan</button></div></div>`;case'change':return `<div class="screen"><div class="screen-title">Change activity</div><div class="screen-sub">Select the new trip purpose.</div>${purposeGrid()}</div>`;case'arrived':return `<div class="screen"><div class="trip-state"><div class="label">Arrived</div><div class="main">${purposeName(state.purpose)}</div><div class="ref">${currentRef()}</div></div>${state.purpose==='client'?`<div class="screen-sub" style="margin-top:4px">Select the management you are starting now.</div>${arrivalFields()}`:''}<div class="action-stack"><button class="primary-action" data-action="start-activity">Start Activity</button></div></div>`;case'activity':return `<div class="screen center"><div class="activity-live"><div class="tiny">${purposeName(state.purpose)}${state.form.reason?` · ${state.form.reason}`:''}</div><div class="timer">00:47</div><div class="ref">${currentRef()}</div></div><div class="action-stack"><button class="primary-action" data-action="leave">Complete / Leave</button></div></div>`;case'complete':return `<div class="screen"><div class="screen-title">Complete activity</div><div class="screen-sub">Select the result; notes are optional.</div>${completionFields()}<div class="action-stack"><button class="primary-action" data-action="finish-activity">Complete</button></div></div>`;case'home-route':return `<div class="screen center"><div class="trip-state"><div class="label">On Route</div><div class="main">Going Home</div></div><div class="trip-meta"><div><b>${state.workMiles.toFixed(1)} mi</b><span>miles today</span></div><div><b>5:14 PM</b><span>departed</span></div></div><div class="action-stack"><button class="primary-action" data-action="arrive-home">Arrived Home</button></div></div>`;case'home':return `<div class="screen center"><div class="screen-title">Route complete</div><div class="screen-sub">You are home.</div><div class="today-mile"><b>${state.workMiles.toFixed(1)} mi</b><span>total miles</span></div><div class="action-stack"><button class="primary-action" data-action="end-work">End Work</button><button class="secondary-action" data-action="continue-work">Continue Working</button></div></div>`;case'midnight':return `<div class="screen center"><div class="screen-title">Saturday · 12:37 AM</div><div class="screen-sub">Session started Friday at 7:48 AM.</div><div class="today-mile"><b>${state.workMiles.toFixed(1)} mi</b><span>Friday work session</span></div><div class="action-stack"><button class="primary-action" data-action="end-work">End Work</button><button class="secondary-action" data-action="continue-work">Continue Working</button></div></div>`;default:return `<div class="screen center"><div class="screen-title">Day complete</div><div class="screen-sub">Work session closed.</div><div class="today-mile"><b>${state.workMiles.toFixed(1)} mi</b><span>total miles</span></div><button class="secondary-action" data-spage="activity">View Activity</button></div>`}}
function supervisorActivity(){const rows=state.activityRange==='week'?demo.week:state.activityRange==='month'?demo.month:demo.year;return `<div class="screen"><div class="tabs" style="margin-bottom:10px">${['day','week','month','year'].map(r=>`<button data-srange="${r}" class="${state.activityRange===r?'active':''}">${r[0].toUpperCase()+r.slice(1)}</button>`).join('')}</div>${state.activityRange==='day'?`<div class="today-mile"><b>42.8 mi</b><span>4 activities · 4h 49m</span></div>${demo.activityGroups.slice(0,4).map(a=>`<div class="mobile-day-activity"><div class="row1"><b>${a.type} · ${a.ref}</b><span>${a.start}–${a.end}</span></div><div class="row2"><span>${a.total}</span><span>${a.miles.toFixed(1)} mi</span></div></div>`).join('')}`:rows.map(r=>`<button class="mobile-day-activity" data-sdrill="${state.activityRange==='week'?'day':state.activityRange==='month'?'week':'month'}"><div class="row1"><b>${r[0]}</b><span>${Number(r[1]).toLocaleString()} mi</span></div><div class="row2"><span>${r[2]}</span><span>${r[3]}</span></div></button>`).join('')}</div>`}
function supervisorMe(){return `<div class="screen"><div class="screen-title">Carlos Martinez</div><div class="screen-sub">Supervisor · Active</div><div class="option-block"><h4>Assigned vehicle</h4><b>2024 Toyota RAV4</b><div class="tiny">Unit V-014 · Regular · 27 operational MPG</div></div><div class="option-block"><h4>Reference fuel</h4><div class="tiny">Regular · ${money(demo.fuel.prices.regular)}/gal · ${demo.fuel.scope}</div></div></div>`}
function supervisorNav(){return `<nav class="mobile-nav"><button data-spage="route" class="${state.supervisorPage==='route'?'active':''}">⌁<br>My Route</button><button data-spage="activity" class="${state.supervisorPage==='activity'?'active':''}">◷<br>Activity</button><button data-spage="me" class="${state.supervisorPage==='me'?'active':''}">●<br>Me</button></nav>`}
function scenarioDrawer(){return `<button class="scenario-btn" data-action="toggle-scenarios">Scenarios</button><div id="scenarioPanel" class="scenario-panel hidden"><small>Jump to workflow state</small>${[['idle','Start of day'],['working','Choose activity'],['pretrip','Pre-trip form'],['route','On route'],['change','Change plan'],['arrived','Arrived'],['activity','Active activity'],['complete','Complete activity'],['home-route','Going home'],['home','Arrived home'],['midnight','After midnight'],['ended','Work ended']].map(x=>`<button data-scenario="${x[0]}">${x[1]}</button>`).join('')}</div>`}
function renderSupervisor(){const body=state.supervisorPage==='route'?supervisorRoute():state.supervisorPage==='activity'?supervisorActivity():supervisorMe();const title=state.supervisorPage==='route'?'My Route':state.supervisorPage==='activity'?'Activity':'Me';return `<div class="supervisor-stage"><div class="mobile-shell"><div class="mobile-top"><div><div class="title">${title}</div><div class="subtle">Friday, September 18</div></div><span class="badge blue">Carlos M.</span></div><div class="mobile-body">${body}</div>${supervisorNav()}</div></div>${scenarioDrawer()}`}
function render(){app.className=`app device-${state.device}`;document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===state.role));document.querySelectorAll('[data-device]').forEach(b=>b.classList.toggle('active',b.dataset.device===state.device));viewport.innerHTML=state.role==='admin'?renderAdmin():renderSupervisor()}
function initFormForPurpose(){state.form={};const p=state.purpose;if(p==='client'){state.form.ref='';state.form.reason=demo.catalogs.visitReasons[0]}else if(p==='recruiting'){state.form.ref=demo.catalogs.recruitingAreas[0];state.form.reason=demo.catalogs.recruitingActivities[0]}else if(p==='employee'){state.form.ref=demo.catalogs.employeeRefs[0];state.form.reason=demo.catalogs.employeeReasons[0]}else if(p==='check'){state.form.ref=demo.catalogs.employeeRefs[0];state.form.reason=demo.catalogs.deliveryTypes[0]}else if(p==='office'){state.form.ref=demo.catalogs.offices[0];state.form.reason=demo.catalogs.officePurposes[0]}else if(p==='other'){state.form.reason=demo.catalogs.otherActivities[0];state.form.ref=demo.catalogs.recruitingAreas[0]}}
function exportExcel(){const rows=[['Supervisor','Date','Activity','Reference','Start','End','Miles','Travel Time','Activity Time','Outcome','Estimated Fuel Cost']],targets=state.reportSupervisor==='all'?demo.supervisors:[demo.supervisors.find(x=>x.id===state.reportSupervisor)||demo.supervisors[0]];targets.forEach((sup,si)=>demo.activityGroups.forEach((a,ai)=>{const factor=(.82+si*.07),miles=Number((a.miles*factor).toFixed(1)),cost=miles/sup.mpg*priceFor(sup.fuel);rows.push([sup.name,'2026-09-18',a.type,a.ref,a.start,a.end,miles,a.travel,a.onsite,a.outcome,cost.toFixed(2)])}));const xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Activity Detail"><Table>${rows.map(r=>`<Row>${r.map(c=>`<Cell><Data ss:Type="${typeof c==='number'?'Number':'String'}">${String(c).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet></Workbook>`;const blob=new Blob([xml],{type:'application/vnd.ms-excel'}),url=URL.createObjectURL(blob),a=document.createElement('a'),label=state.reportSupervisor==='all'?'All_Supervisors':(targets[0].name.replace(/\s+/g,'_'));a.href=url;a.download=`CER_Route_Activity_Detail_${label}_2026-09-18.xls`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);toast('Excel detail exported')}
function reset(){Object.assign(state,{role:'admin',device:'desktop',adminPage:'today',selectedSupervisor:'carlos',adminMobileDetail:null,activityRange:'day',reportRange:'week',reportSupervisor:'all',configPage:'activity',supervisorPage:'route',supState:'idle',purpose:null,form:{},workMiles:0,workStarted:null,afterMidnight:false});render();toast('Demo reset')}
function supAction(a){if(a==='start-work'){state.supState='working';state.workStarted='7:48 AM'}else if(a==='back-purpose'){state.supState='working'}else if(a==='start-trip'){if(state.purpose==='client'&&!String(state.form.ref||'').trim()){toast('Enter destination');return}state.supState=state.purpose==='home'?'home-route':'route';state.workMiles=Math.max(state.workMiles,12.6)}else if(a==='change-plan'){state.supState='change';state.purpose=null;state.form={}}else if(a==='arrive'){state.workMiles+=8.2;state.supState='arrived'}else if(a==='start-activity'){state.supState='activity'}else if(a==='leave'){state.supState='complete';if(!state.form.outcome)state.form.outcome=demo.catalogs.outcomes[0]}else if(a==='finish-activity'){state.supState='working';state.purpose=null;state.form={}}else if(a==='arrive-home'){state.workMiles+=14.4;state.supState='home'}else if(a==='continue-work'){state.supState='working';state.purpose=null;state.form={}}else if(a==='end-work'){state.supState='ended'}else if(a==='mobile-back'){state.adminMobileDetail=null}else if(a==='save-fuel'){document.querySelectorAll('.fuel-input').forEach(i=>demo.fuel.prices[i.dataset.fuel]=Number(i.value));toast('Fuel reference prices saved')}else if(a==='export-excel'){exportExcel();return}else if(a==='toggle-scenarios'){document.getElementById('scenarioPanel')?.classList.toggle('hidden');return}render()}
document.addEventListener('click',e=>{const el=e.target.closest('button,[data-supervisor],[data-open-activity],[data-mobile-supervisor],[data-apage],[data-range],[data-report-range],[data-config],[data-purpose],[data-scenario],[data-sdrill]');if(!el)return;if(el.dataset.role){state.role=el.dataset.role;render();return}if(el.dataset.device){state.device=el.dataset.device;state.adminMobileDetail=null;render();return}if(el.dataset.apage){state.adminPage=el.dataset.apage;state.adminMobileDetail=null;render();return}if(el.dataset.supervisor){state.selectedSupervisor=el.dataset.supervisor;render();return}if(el.dataset.mobileSupervisor){state.adminMobileDetail=el.dataset.mobileSupervisor;render();return}if(el.dataset.openActivity){state.selectedSupervisor=el.dataset.openActivity;state.adminPage='activity';state.activityRange='day';state.adminMobileDetail=null;render();return}if(el.dataset.range){state.activityRange=el.dataset.range;render();return}if(el.dataset.drill){state.activityRange=el.dataset.drill;render();return}if(el.dataset.reportRange){state.reportRange=el.dataset.reportRange;render();return}if(el.dataset.config){state.configPage=el.dataset.config;render();return}if(el.dataset.purpose){state.purpose=el.dataset.purpose;if(state.purpose==='home'){state.supState='home-route'}else{initFormForPurpose();state.supState='pretrip'}render();return}if(el.dataset.spage){state.supervisorPage=el.dataset.spage;render();return}if(el.dataset.srange){state.activityRange=el.dataset.srange;render();return}if(el.dataset.sdrill){state.activityRange=el.dataset.sdrill;render();return}if(el.dataset.scenario){state.role='supervisor';state.supervisorPage='route';state.supState=el.dataset.scenario;state.workStarted='7:48 AM';state.workMiles=42.8;state.purpose=state.purpose||'client';if(!Object.keys(state.form).length)initFormForPurpose();state.afterMidnight=el.dataset.scenario==='midnight';render();return}if(el.dataset.action==='reset'){reset();return}if(el.dataset.action){supAction(el.dataset.action)}});
document.addEventListener('input',e=>{if(e.target.dataset.formKey)state.form[e.target.dataset.formKey]=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='supSelect'){state.selectedSupervisor=e.target.value;render();return}if(e.target.id==='reportSupSelect'){state.reportSupervisor=e.target.value;render();return}if(e.target.dataset.formKey){state.form[e.target.dataset.formKey]=e.target.value}});
render();
})();

</script>
</body>
</html>
