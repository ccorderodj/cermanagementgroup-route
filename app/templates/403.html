<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access denied</title>
    <link rel="icon" type="image/svg+xml" href="{{ app.icon_path }}">
    <link rel="stylesheet" href="/static/javascript/css/main.css">
</head>
<body class="bg-background text-foreground">
    <main class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="text-center max-w-xl">
            <p class="text-7xl font-extrabold text-primary mb-4">403</p>
            <h1 class="text-2xl font-semibold mb-3">Access denied</h1>
            <p class="text-muted-foreground mb-8">
                {{ detail or "You do not have permission to open this section. Ask an administrator of this company if you need access." }}
            </p>
            <a href="{{ app.default_path }}"
               class="inline-block rounded-lg bg-primary px-6 py-3 text-primary-foreground">
                Back to the dashboard
            </a>
        </div>
    </main>
</body>
</html>
