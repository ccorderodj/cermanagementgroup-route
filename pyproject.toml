[project]
name = "cer-application-foundation"
version = "0.1.0"
description = "CER application foundation: reusable FastAPI + React modular monolith base"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "apscheduler>=3.11,<4",
    "argon2-cffi>=25.1.0",
    "asgi-correlation-id>=5.0.1",
    "asyncpg>=0.31.0",
    "boto3>=1.43.91",
    "cryptography>=50.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "msal>=1.38.0",
    "passlib>=1.7.4",
    "pillow>=12.3.0",
    "pillow-heif>=1.7.0",
    "prometheus-client>=0.24.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.0",
    "pypdfium2>=5.13.0",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "python-json-logger>=4.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "autoflake>=2.3.3",
    "black>=26.5.1",
    "flake8>=7.3.0",
    "isort>=8.0.1",
    "moto[s3]>=5.2.3",
    "playwright>=1.63.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "time-machine>=3.4.0",
]

[tool.pytest.ini_options]
# La raiz del repositorio en sys.path: la suite importa `app.*` y pytest solo
# anade el directorio de los tests. Sin esto la suite solo corre si el paquete
# esta instalado en el entorno, que no es el caso en una copia recien clonada.
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
# Tres workers, cada uno con su base, y los tests de navegador juntos en uno
# (ver `tests/conftest.py`). `-n 0` para depurar en un solo proceso.
addopts = "-q --strict-markers -n 3 --dist loadgroup"
markers = [
    "integration: necesita una base PostgreSQL 14 real (TEST_DATABASE_URL)",
    "browser: conduce un navegador real (Edge del sistema) contra un uvicorn vivo",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100
