# =============================================================================
# Entorno reproducible con Docker
# =============================================================================
# Es una VÍA ALTERNATIVA, no un requisito: el flujo local con `.venv` y el
# PostgreSQL de la máquina sigue siendo válido y es el que documenta el README.
#
# El compose anterior no levantaba: ejecutaba `/code/docker/app.sh`, un script
# que no existe, montaba un directorio inexistente y no traía base de datos, así
# que la aplicación no tenía contra qué conectarse (AUD-TOOL-004).
#
#   docker compose up --build           aplicación + PostgreSQL
#   docker compose run --rm tests       la suite contra una base efímera
#
# El acceso es por subdominio, igual que en local:  http://cer.localhost:8000
# =============================================================================

services:
  db:
    image: postgres:14
    container_name: cer_app_db
    environment:
      POSTGRES_DB: cer_app
      POSTGRES_USER: cer_app
      # Solo para el entorno de contenedores; no es la contraseña de nada real.
      POSTGRES_PASSWORD: cer_app_local_compose
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea `cer_app_test` al inicializar el volumen: asi el rol de la
      # aplicacion no necesita CREATEDB, que es el privilegio que se le retiro.
      - ./docker/initdb-test-database.sh:/docker-entrypoint-initdb.d/10-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cer_app -d cer_app"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: cer_app_web
    depends_on:
      db:
        condition: service_healthy
    environment:
      MODE: DEV
      LOG_LEVEL: INFO
      # Con `localhost` como dominio base se entra por http://cer.localhost:8000
      # y el navegador resuelve cualquier `*.localhost` sin tocar el fichero
      # hosts (RFC 6761).
      BASE_DOMAIN: localhost
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: cer_app
      DB_PASS: cer_app_local_compose
      DB_NAME: cer_app
      DB_CLOUDSQL_CONNECTION_NAME: ""
      # Clave de desarrollo del contenedor. `app/config.py` rechaza los
      # placeholders conocidos y exige 32 caracteres como mínimo.
      SECRET_KEY: compose-only-key-not-a-secret-0123456789abcdef
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      ENABLE_METRICS: "true"
      ENABLE_API_DOCS: "false"
      EMAIL_BACKEND: console
    ports:
      - "8000:8000"
    # Migraciones y siembra antes de arrancar: un contenedor recién creado tiene
    # la base vacía.
    command: >
      sh -c "
        alembic -c app/alembic.ini upgrade head &&
        python -m app.db.scripts.bootstrap &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  # Suite completa contra un PostgreSQL efímero. Nunca SQLite.
  tests:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      MODE: TEST
      LOG_LEVEL: WARNING
      BASE_DOMAIN: localhost
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: cer_app
      DB_PASS: cer_app_local_compose
      DB_NAME: cer_app
      DB_CLOUDSQL_CONNECTION_NAME: ""
      TEST_DATABASE_URL: postgresql+asyncpg://cer_app:cer_app_local_compose@db:5432/cer_app_test
      SECRET_KEY: compose-only-key-not-a-secret-0123456789abcdef
      ALGORITHM: HS256
      EMAIL_BACKEND: memory
    profiles: ["tests"]
    # La base `cer_app_test` la crea el contenedor de PostgreSQL al
    # inicializarse; aqui solo se ejecuta la suite, que se encarga del esquema.
    command: ["pytest"]

volumes:
  pgdata:
